<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Edit Business — {{ agency_settings.agency_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { background-color: #09090b; font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen p-6 sm:p-12 max-w-xl mx-auto space-y-6" style="--agency-primary: {{ agency_settings.primary_color }}; --agency-on-primary: {{ agency_settings.primary_contrast }};">

  {% include "includes/agency_brand.html" %}
  <a href="{{ url_for('customer.businesses') }}" class="text-xs font-mono text-[var(--agency-primary)] hover:underline">← Cancel & Return</a>

  <div class="pb-4 border-b border-zinc-800">
    <h1 class="text-2xl font-extrabold text-white">Edit Business Profile</h1>
    <p class="text-xs text-zinc-400 mt-1">Update brand information for project association.</p>
  </div>

  <form method="POST" action="{{ url_for('customer.edit_business', business_id=business.id) }}" class="space-y-4 text-xs">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
      <label class="block text-zinc-400 mb-1 font-semibold">Business Name *</label>
      <input type="text" name="name" value="{{ business.name }}" required class="w-full p-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-[var(--agency-primary)]">
    </div>

    <div>
      <label class="block text-zinc-400 mb-1 font-semibold">Industry / Business Type</label>
      <input type="text" name="business_type" value="{{ business.business_type or '' }}" placeholder="Retail, Tech, Restaurant" class="w-full p-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-[var(--agency-primary)]">
    </div>

    <div>
      <label class="block text-zinc-400 mb-1 font-semibold">Location / Operating City</label>
      <input type="text" name="location" value="{{ business.location or '' }}" placeholder="Mumbai, Maharashtra" class="w-full p-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-[var(--agency-primary)]">
    </div>

    <div>
      <label class="block text-zinc-400 mb-1 font-semibold">Website URL</label>
      <input type="url" name="website" value="{{ business.website or '' }}" placeholder="https://yourbusiness.com" class="w-full p-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-[var(--agency-primary)]">
    </div>

    <button type="submit" class="w-full py-3 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-bold transition cursor-pointer">
      Save Business Changes
    </button>
  </form>

</body>
</html>
