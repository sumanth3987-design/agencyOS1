<!-- Save this directly into: templates/includes/agency_brand.html -->
<div class="mb-6 flex items-center justify-between gap-4 border-b border-zinc-800 pb-4" aria-label="Agency identity">
  <a
    href="{{ url_for('customer.dashboard') if current_user.is_authenticated and current_user.role|lower in ['customer', 'client', 'admin'] else url_for('professional.professional_dashboard') if current_user.is_authenticated and current_user.role|lower == 'professional' else url_for('public.index') }}"
    class="inline-flex min-w-0 items-center gap-2.5 rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
  >
    {% if agency_settings.logo_url %}
      <img
        src="{{ agency_settings.logo_url }}"
        alt="{{ agency_settings.agency_name }} logo"
        onerror="this.hidden=true; this.nextElementSibling.hidden=false; this.nextElementSibling.classList.remove('hidden');"
        class="h-8 w-8 shrink-0 rounded border border-zinc-700 bg-zinc-900 object-contain p-1"
      >
      <span
        class="hidden h-8 w-8 shrink-0 items-center justify-center rounded border border-zinc-700 font-mono text-xs font-bold"
        style="background-color: var(--agency-primary); color: var(--agency-on-primary);"
        aria-hidden="true"
      >{{ agency_settings.agency_name[:2]|upper }}</span>
    {% else %}
      <span
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded font-mono text-xs font-bold"
        style="background-color: var(--agency-primary); color: var(--agency-on-primary);"
        aria-hidden="true"
      >{{ agency_settings.agency_name[:2]|upper }}</span>
    {% endif %}
    <span class="truncate font-mono text-sm font-bold tracking-tight text-white uppercase">
      {{ agency_settings.agency_name }}<span class="ml-1 inline-block h-1.5 w-1.5 rounded-full bg-emerald-400 align-middle" aria-hidden="true"></span>
    </span>
  </a>

  <span class="hidden shrink-0 font-mono text-[10px] uppercase tracking-wider text-zinc-500 sm:inline">
    Node IST • SAC 998311
  </span>
</div>
