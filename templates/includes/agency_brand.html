<div class="mb-6 flex items-center justify-between gap-4 border-b border-zinc-800/80 pb-4" aria-label="Agency identity">
  <a href="{{ url_for('customer.dashboard') if current_user.is_authenticated and current_user.role|lower in ['customer', 'client', 'admin'] else url_for('professional_dashboard') }}"
     class="inline-flex min-w-0 items-center gap-3 rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white">
    {% if agency_settings.logo_url %}
      <img src="{{ agency_settings.logo_url }}" alt="{{ agency_settings.agency_name }} logo" onerror="this.hidden=true; this.nextElementSibling.hidden=false; this.nextElementSibling.classList.remove('hidden');" class="h-9 w-9 shrink-0 rounded-lg border border-zinc-700 bg-zinc-900 object-contain p-1">
      <span class="hidden h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-zinc-700 text-xs font-extrabold" style="background-color: var(--agency-primary); color: var(--agency-on-primary);" aria-hidden="true">{{ agency_settings.agency_name[:2]|upper }}</span>
    {% else %}
      <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-xs font-extrabold" style="background-color: var(--agency-primary); color: var(--agency-on-primary);" aria-hidden="true">{{ agency_settings.agency_name[:2]|upper }}</span>
    {% endif %}
    <span class="truncate text-sm font-extrabold tracking-tight text-white">{{ agency_settings.agency_name }}<span class="ml-1 inline-block h-1.5 w-1.5 rounded-full align-middle" style="background-color: var(--agency-primary)" aria-hidden="true"></span></span>
  </a>
  <span class="hidden shrink-0 font-mono text-[9px] uppercase tracking-[.16em] text-zinc-600 sm:inline">Agency workspace</span>
</div>
