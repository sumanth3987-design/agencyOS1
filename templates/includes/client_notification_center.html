<!-- Save this directly into: templates/includes/client_notification_center.html -->
<style>
  .notification-panel {
    width: min(24rem, calc(100vw - 2rem));
    background: #101014;
    border: 1px solid #27272a;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
  }
  .notification-panel[hidden] { display: none; }
  .notification-row { border-left: 2px solid transparent; }
  .notification-row.unread {
    background: rgba(255, 255, 255, 0.03);
    border-left-color: #6366f1;
  }
</style>

<div
  class="notification-center relative inline-block"
  data-notification-center
  data-notifications-url="{{ url_for('collaboration.get_notifications') }}"
  data-mark-read-url="{{ url_for('collaboration.mark_notification_read', notification_id=0) }}"
  data-clear-all-url="{{ url_for('collaboration.clear_all_notifications') }}"
  data-csrf-token="{{ csrf_token() }}"
>
  <button
    type="button"
    class="notification-trigger relative h-9 w-9 rounded-lg border border-zinc-800 bg-zinc-900 text-zinc-300 hover:text-white hover:border-zinc-600 transition flex items-center justify-center cursor-pointer"
    aria-label="Notifications"
    aria-haspopup="dialog"
    aria-expanded="false"
    aria-controls="client-notification-panel"
    data-notification-toggle
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    <span
      class="absolute -top-1 -right-1 min-w-[16px] h-[16px] px-1 rounded-full bg-indigo-500 text-white font-mono text-[9px] leading-[16px] font-bold text-center shadow"
      data-notification-badge
      aria-live="polite"
      hidden
    ></span>
  </button>

  <section
    id="client-notification-panel"
    class="notification-panel absolute right-0 top-full mt-2 z-[70] rounded-xl overflow-hidden"
    role="dialog"
    aria-labelledby="client-notification-heading"
    tabindex="-1"
    data-notification-panel
    hidden
  >
    <header class="px-4 py-3 border-b border-zinc-800 bg-zinc-950 flex items-center justify-between gap-3 font-mono text-xs">
      <div>
        <h2 id="client-notification-heading" class="font-bold text-white uppercase tracking-wider">Action &amp; Audit Dispatch</h2>
        <p class="text-[10px] text-zinc-500 mt-0.5">Real-Time Event &amp; Approval Feed</p>
      </div>
      <button
        type="button"
        class="text-[11px] font-mono text-zinc-400 hover:text-white disabled:text-zinc-600 disabled:cursor-not-allowed transition cursor-pointer"
        data-notification-clear
        disabled
      >Clear all</button>
    </header>

    <p class="px-4 py-2 font-mono text-[11px] text-zinc-400 border-b border-zinc-800 bg-zinc-950/60" data-notification-status role="status" aria-live="polite">Loading feed…</p>
    <div class="max-h-[min(65vh,26rem)] overflow-y-auto overscroll-contain divide-y divide-zinc-800/60" data-notification-list></div>
  </section>
</div>

<script>
  (function () {
    var root = document.querySelector("[data-notification-center]");
    if (!root) return;

    var toggle = root.querySelector("[data-notification-toggle]");
    var panel = root.querySelector("[data-notification-panel]");
    var badge = root.querySelector("[data-notification-badge]");
    var list = root.querySelector("[data-notification-list]");
    var status = root.querySelector("[data-notification-status]");
    var clearButton = root.querySelector("[data-notification-clear]");

    var loading = false;
    var busy = false;
    var lastUnreadCount = 0;

    function setStatus(message, isError) {
      if (!status) return;
      status.textContent = message;
      status.className = isError
        ? "px-4 py-2 font-mono text-[11px] text-red-400 border-b border-zinc-800 bg-zinc-950/60"
        : "px-4 py-2 font-mono text-[11px] text-zinc-400 border-b border-zinc-800 bg-zinc-950/60";
    }

    function safeHref(value) {
      try {
        var url = new URL(value, window.location.origin);
        return url.origin === window.location.origin ? url.pathname + url.search + url.hash : null;
      } catch (e) {
        return null;
      }
    }

    async function refresh() {
      if (loading || !root.dataset.notificationsUrl) return;
      loading = true;

      try {
        var response = await fetch(root.dataset.notificationsUrl, {
          credentials: "same-origin",
          headers: { "Accept": "application/json" }
        });
        var data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || "Could not fetch notifications.");
        }

        var unreadCount = Number(data.unread_count || data.count || 0);
        lastUnreadCount = unreadCount;
        if (badge) {
          badge.textContent = unreadCount > 99 ? "99+" : String(unreadCount);
          badge.hidden = unreadCount < 1;
        }
        if (toggle) {
          toggle.setAttribute("aria-label", unreadCount ? "Notifications, " + unreadCount + " unread" : "Notifications");
        }

        if (list) list.replaceChildren();
        if (clearButton) clearButton.disabled = unreadCount === 0 || busy;

        if (!Array.isArray(data.notifications) || data.notifications.length === 0) {
          setStatus("", false);
          var empty = document.createElement("p");
          empty.className = "px-5 py-8 text-center font-mono text-xs text-zinc-500";
          empty.textContent = "All milestones up to date. No pending actions.";
          if (list) list.append(empty);
          return;
        }

        setStatus(unreadCount + " pending alert(s)", false);

        data.notifications.forEach(function (n) {
          var href = safeHref(n.link);
          var item = document.createElement("div");
          item.className = "notification-row block px-4 py-3 hover:bg-zinc-850/50 transition " + (n.is_read ? "" : "unread");

          var headline = document.createElement("div");
          headline.className = "flex items-start justify-between gap-2 text-xs font-bold text-zinc-200 font-sans";

          var title = document.createElement("span");
          title.className = "truncate text-white";
          title.textContent = n.title || "Project Alert";
          headline.append(title);

          if (!n.is_read) {
            var dot = document.createElement("span");
            dot.className = "h-2 w-2 rounded-full bg-indigo-500 shrink-0 mt-1";
            headline.append(dot);
          }

          var message = document.createElement("p");
          message.className = "mt-1 text-[11px] text-zinc-400 font-sans leading-relaxed";
          message.textContent = n.message || "";

          var footer = document.createElement("div");
          footer.className = "flex items-center justify-between mt-2 pt-1.5 border-t border-zinc-800/40";

          var timestamp = document.createElement("time");
          timestamp.className = "font-mono text-[9px] text-zinc-500";
          timestamp.textContent = n.created_at || "";
          footer.append(timestamp);

          if (href) {
            var actionBtn = document.createElement("a");
            actionBtn.href = href;
            actionBtn.className = "px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-[10px] font-mono font-semibold transition cursor-pointer";
            actionBtn.textContent = "Take Action →";

            actionBtn.addEventListener("click", async function (e) {
              if (busy) return;
              busy = true;
              try {
                var endpoint = root.dataset.markReadUrl.replace(/0\/read$/, encodeURIComponent(n.id) + "/read");
                await fetch(endpoint, {
                  method: "POST",
                  credentials: "same-origin",
                  headers: { "X-CSRFToken": root.dataset.csrfToken, "Accept": "application/json" }
                });
              } catch (_) {}
            });
            footer.append(actionBtn);
          }

          item.append(headline, message, footer);
          if (list) list.append(item);
        });
      } catch (err) {
        setStatus(err.message || "Failed to load notifications.", true);
      } finally {
        loading = false;
      }
    }

    function closePanel(restoreFocus) {
      if (!panel || !toggle) return;
      panel.hidden = true;
      toggle.setAttribute("aria-expanded", "false");
      if (restoreFocus) toggle.focus();
    }

    if (toggle && panel) {
      toggle.addEventListener("click", async function () {
        var opening = panel.hidden;
        panel.hidden = !opening;
        toggle.setAttribute("aria-expanded", String(opening));
        if (opening) {
          await refresh();
          panel.focus();
        }
      });
    }

    if (clearButton) {
      clearButton.addEventListener("click", async function () {
        if (busy || clearButton.disabled) return;
        busy = true;
        clearButton.disabled = true;
        setStatus("Clearing alerts...", false);

        try {
          var response = await fetch(root.dataset.clearAllUrl, {
            method: "POST",
            credentials: "same-origin",
            headers: { "X-CSRFToken": root.dataset.csrfToken, "Accept": "application/json" }
          });
          var result = await response.json();
          if (!response.ok || !result.success) {
            throw new Error(result.error || "Could not clear alerts.");
          }
          await refresh();
        } catch (err) {
          setStatus(err.message || "Could not clear alerts.", true);
        } finally {
          busy = false;
          if (clearButton) clearButton.disabled = lastUnreadCount === 0;
        }
      });
    }

    document.addEventListener("click", function (event) {
      if (panel && !root.contains(event.target) && !panel.hidden) {
        closePanel(false);
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && panel && !panel.hidden) {
        closePanel(true);
      }
    });

    refresh();
  })();
</script>
