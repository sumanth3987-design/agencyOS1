<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Resource Not Found — AgencyOS</title>

  <!-- Typography: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            zinc: {
              950: '#09090b',
              900: '#101014',
              850: '#18181b',
              800: '#27272a',
              700: '#3f3f46',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-6 selection:bg-zinc-100 selection:text-zinc-950 antialiased font-sans text-center">

  <div class="w-full max-w-md border border-zinc-800 bg-zinc-900 rounded-lg p-8 shadow-2xl space-y-4">
    <div class="h-10 w-10 mx-auto rounded border border-zinc-700 bg-zinc-950 text-white font-mono font-bold text-sm flex items-center justify-center">
      404
    </div>

    <h1 class="text-2xl font-extrabold text-white tracking-tight">Resource Not Located</h1>
    <p class="text-xs font-mono text-zinc-400 leading-relaxed">
      The deliverable, milestone invoice, or project route you requested does not exist or has been relocated within the workspace.
    </p>

    <div class="pt-4 flex flex-col sm:flex-row gap-2 justify-center font-mono text-xs">
      <a href="{{ url_for('customer.dashboard') }}" class="btn btn-primary text-xs h-10 px-5 font-semibold">
        Return to Workspace →
      </a>
      <a href="{{ url_for('public.index') }}" class="btn btn-secondary text-xs h-10 px-4">
        Homepage
      </a>
    </div>
  </div>

</body>
</html>
