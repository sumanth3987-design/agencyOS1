<!-- Save this directly into: templates/reset_password.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — AgencyOS</title>

  <!-- Typography: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            zinc: {
              950: '#09090b',
              900: '#101014',
              850: '#18181b',
              800: '#27272a',
              700: '#3f3f46',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-6 selection:bg-zinc-100 selection:text-zinc-950 antialiased font-sans">

  <div class="w-full max-w-sm border border-zinc-800 bg-zinc-900 rounded-lg p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="h-8 w-8 mx-auto rounded bg-white text-zinc-950 font-mono font-bold text-xs flex items-center justify-center">
        A
      </div>
      <h1 class="text-xl font-extrabold text-white tracking-tight">Set New Password</h1>
      <p class="text-xs font-mono text-zinc-400">Configure a secure credential (8+ characters, letters &amp; numbers).</p>
    </div>

    <!-- Flash Messages Slot -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="space-y-2 font-mono text-xs">
          {% for category, message in messages %}
            <div class="system-alert {{ 'system-alert-success' if category == 'success' else 'system-alert-error' }}">
              <span>{{ message }}</span>
              <button onclick="this.parentElement.remove()" class="text-zinc-400 hover:text-white ml-auto cursor-pointer">✕</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-4 font-mono text-xs">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label class="block text-zinc-400 mb-1">New Password *</label>
        <input
          type="password"
          name="password"
          required
          placeholder="••••••••"
          class="form-control text-xs"
        >
      </div>

      <div>
        <label class="block text-zinc-400 mb-1">Confirm New Password *</label>
        <input
          type="password"
          name="confirm_password"
          required
          placeholder="••••••••"
          class="form-control text-xs"
        >
      </div>

      <button type="submit" class="btn btn-primary w-full h-11 text-xs font-semibold cursor-pointer">
        Update Password &amp; Sign In →
      </button>
    </form>

    <div class="pt-4 border-t border-zinc-800 text-center font-mono text-xs text-zinc-500">
      <a href="{{ url_for('auth.login') }}" class="text-white hover:underline font-bold">
        ← Back to Sign In
      </a>
    </div>
  </div>

</body>
</html>
