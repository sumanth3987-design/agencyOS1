<!-- Save this directly into: templates/reset_password.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — AgencyOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { background-color: #09090b; font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-6 selection:bg-indigo-500 selection:text-white">

  <div class="max-w-sm w-full p-8 rounded-2xl bg-[#121215] border border-zinc-800 shadow-2xl space-y-4">
    <div class="h-10 w-10 mx-auto rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
      AO
    </div>

    <div class="text-center">
      <h1 class="text-xl font-extrabold text-white">Set New Password</h1>
      <p class="text-xs text-zinc-400 mt-1">Enter your new secure password (8+ characters, letters & numbers).</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="space-y-2">
          {% for msg in messages %}
            <div class="p-3 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300 text-xs">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-4 text-xs">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label class="block text-zinc-400 font-semibold mb-1">New Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-zinc-400 font-semibold mb-1">Confirm New Password</label>
        <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white focus:outline-none focus:border-indigo-500">
      </div>

      <button type="submit" class="w-full py-3 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-bold text-xs shadow-lg transition cursor-pointer">
        Update Password & Sign In →
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="{{ url_for('auth.login') }}" class="text-xs text-zinc-500 hover:text-indigo-400">Back to Login</a>
    </div>
  </div>

</body>
</html>
